<header class="app-header border-bottom py-2 px-3 px-md-4 sticky-top">
  <div class="d-flex align-items-center justify-content-between">
    <!-- Brand Logo -->
    <a class="navbar-brand d-flex align-items-center gap-2 fw-bold text-uppercase brand-logo text-decoration-none"
      routerLink="/app/dash">
      <svg width="28" height="28" viewBox="0 0 36 36" fill="none" class="brand-logo-icon">
        <circle cx="18" cy="18" r="14" stroke="currentColor" stroke-width="4" stroke-dasharray="18 6" />
        <circle cx="18" cy="31" r="2.5" fill="#facc15" />
      </svg>
      <span class="brand-logo-text">GROWW<span class="text-volt">GYM</span></span>
    </a>

    <!-- Middle Location & Status Badge -->
    <div class="d-none d-lg-flex align-items-center gap-3">
      <div class="studio-badge px-3 py-1 rounded-pill small fw-semibold d-flex align-items-center gap-2">
        <span class="studio-dot"></span>
        <span>Indiranagar Studio • Athlete Portal</span>
      </div>
    </div>

    <!-- Right Controls: Theme Toggle + Athlete Chip + Logout -->
    <div class="d-flex align-items-center gap-2">
      <!-- Theme Toggle -->
      <button type="button"
        class="btn btn-theme-toggle rounded-circle d-inline-flex align-items-center justify-content-center"
        (click)="toggleTheme()" [attr.aria-label]="isDarkMode ? 'Switch to Light Mode' : 'Switch to Dark Mode'"
        [title]="isDarkMode ? 'Switch to Light Mode' : 'Switch to Dark Mode'">
        <svg *ngIf="isDarkMode" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="5"></circle>
          <line x1="12" y1="1" x2="12" y2="3"></line>
          <line x1="12" y1="21" x2="12" y2="23"></line>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
          <line x1="1" y1="12" x2="3" y2="12"></line>
          <line x1="21" y1="12" x2="23" y2="12"></line>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
        </svg>
        <svg *ngIf="!isDarkMode" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
        </svg>
      </button>

      <!-- Athlete Chip -->
      <div class="athlete-chip d-flex align-items-center gap-2 px-2 py-1 rounded-pill border">
        <div class="athlete-avatar rounded-circle d-flex align-items-center justify-content-center fw-bold">
          DS
        </div>
        <div class="d-none d-sm-block text-start pe-2">
          <div class="fw-bold small lh-1">Dhanush S.</div>
          <div class="text-muted" style="font-size: 0.70rem;">Athlete #GG-842</div>
        </div>
      </div>

      <!-- Sign Out Button -->
      <button type="button"
        class="btn btn-outline-danger btn-sm rounded-pill px-3 py-1 d-inline-flex align-items-center gap-1"
        (click)="onSignOut()" title="Sign Out">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
          <polyline points="16 17 21 12 16 7"></polyline>
          <line x1="21" y1="12" x2="9" y2="12"></line>
        </svg>
        <span class="d-none d-md-inline small fw-semibold">Sign Out</span>
      </button>
    </div>
  </div>
</header>
